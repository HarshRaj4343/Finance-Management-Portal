# TLS termination for the finance portal.
#
# The institute asked for the portal on port 8116 with SSL. nginx holds
# that port, terminates TLS with the certificates they supplied, and
# passes requests to the Next.js container over the private compose
# network. The app container publishes nothing to the outside world.
#
# The certificate and key are mounted at these fixed paths by
# docker-compose.yml, whatever they are called on the host.

upstream portal {
    server next-app:3000;
    keepalive 16;
}

server {
    listen 8116 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Bills carry no attachments today, but leave room for a form post.
    client_max_body_size 10m;

    # The app sets its own CSP, HSTS and frame headers; they pass through.
    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;

        # NextAuth builds callback URLs from these. If X-Forwarded-Proto
        # says http, sign-in redirects come back as http and the secure
        # session cookie is dropped -- which looks like "login does
        # nothing" rather than a proxy misconfiguration.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8116;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
