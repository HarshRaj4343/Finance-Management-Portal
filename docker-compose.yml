# PILOT deployment: two containers, one private network.
#
# The database is NOT reachable from outside this compose network -- it
# publishes no port on the host, so the only thing that can talk to it is
# the app container. Back it up with scripts/db-backup.sh.
#
# ---------------------------------------------------------------------
# THIS IS SET UP FOR PILOT TESTING, NOT FOR REAL MONEY:
#   * the demo dataset is loaded into the database (59 people, 151 bills)
#   * demo logins are on, so Dean / Finance Admin / Audit / SNP /
#     Bill-form / Bill-edit / "pda manager" / User sign in with
#     DEMO_PASSWORD and no LDAP
# Before the portal handles real bills, do both of these:
#   1. delete the 0003_demo_data.sql line below, and recreate the
#      database:  docker compose down -v && docker compose up -d
#   2. remove DEMO_LOGIN_ENABLED and DEMO_PASSWORD from .env
# ---------------------------------------------------------------------
#
# Required in .env (see .env.example):
#   POSTGRES_PASSWORD   database password, generated, not a word
#   NEXTAUTH_SECRET     openssl rand -base64 32
#   NEXTAUTH_URL        https://<the portal's public URL>
#   DEMO_LOGIN_ENABLED=true and DEMO_PASSWORD   (pilot only)
#   LDAP_URL, LDAP_BASE_DN, OU                  (if LDAP is reachable)
#
services:
  db:
    image: postgres:17-alpine
    container_name: ifmp_db
    environment:
      POSTGRES_DB: ifmp
      POSTGRES_USER: ifmp
      # No default: compose refuses to start if it is not set.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, in name order, when the data volume is first created.
      # They do NOT re-run on a restart; to load them again you must
      # destroy the volume:  docker compose down -v  (DESTROYS DATA)
      - ./db/migrations/0001_schema.sql:/docker-entrypoint-initdb.d/0001_schema.sql:ro
      - ./db/migrations/0002_functions.sql:/docker-entrypoint-initdb.d/0002_functions.sql:ro
      # PILOT ONLY -- the demo dataset, and the demo accounts (Dean,
      # Finance Admin, Audit, SNP, ...) that the demo logins sign in as.
      # Delete this line before the portal is used for real bills.
      - ./db/seed/0003_demo_data.sql:/docker-entrypoint-initdb.d/0003_demo_data.sql:ro
    # No `ports:` -- the database is reachable only on the compose network,
    # as the institute asked. To inspect it:
    #   docker compose exec db psql -U ifmp -d ifmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifmp -d ifmp"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  next-app:
    build:
      context: .
      dockerfile: Dockerfile

    image: iitmandi-finance-portal:latest
    container_name: my_next_app

    # Server-side secrets (LDAP, SMTP, NextAuth) are read at runtime.
    env_file:
      - .env

    environment:
      - NODE_ENV=production
      # Inside compose the database is the `db` service, whatever .env says.
      - DATABASE_URL=postgres://ifmp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ifmp

    depends_on:
      db:
        condition: service_healthy

    # No host port: the only way in is through the `proxy` service, which
    # terminates TLS on 8116. Uncomment for a plain-HTTP local run.
    # ports:
    #   - "127.0.0.1:3000:3000"

    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # TLS termination on the port the institute allocated (8116).
  #
  # SSL_CERT_FILE and SSL_KEY_FILE are paths ON THE HOST -- the two files
  # IT copied into your home directory, e.g.
  #   SSL_CERT_FILE=/home/<user>/portal.crt
  #   SSL_KEY_FILE=/home/<user>/portal.key
  # Whatever they are named, they are mounted read-only at a fixed path
  # inside the container, so deploy/nginx/portal.conf never changes.
  proxy:
    image: nginx:1.27-alpine
    container_name: ifmp_proxy
    volumes:
      - ./deploy/nginx/portal.conf:/etc/nginx/conf.d/portal.conf:ro
      - ./deploy/nginx/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ${SSL_CERT_FILE:?set SSL_CERT_FILE in .env to the certificate path}:/etc/nginx/certs/server.crt:ro
      - ${SSL_KEY_FILE:?set SSL_KEY_FILE in .env to the private key path}:/etc/nginx/certs/server.key:ro
    # The institute allocated 8116. If that changes, set PORTAL_PORT in
    # .env -- nginx keeps listening on 8116 inside the container.
    ports:
      - "${PORTAL_PORT:-8116}:8116"
    depends_on:
      next-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
