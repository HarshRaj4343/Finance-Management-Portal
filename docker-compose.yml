services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compiled into the browser bundle at build time -- see Dockerfile.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    image: iitmandi-finance-portal:latest
    container_name: my_next_app

    # Server-side secrets (LDAP, SMTP, service-role key, NextAuth) are read
    # at runtime, so .env is enough for these.
    env_file:
      - .env

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production

    restart: unless-stopped
